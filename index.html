<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Test Koneksi Firestore - Quiz Cloud Computing</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 600px; margin: 40px auto; padding: 0 20px; color: #222; }
    h2 { color: #1F4E78; }
    #status { color: #555; font-weight: bold; }
    #soal-box { border: 2px solid #1F4E78; border-radius: 8px; padding: 20px; margin-top: 20px; display: none; }
    .pilihan { padding: 10px; margin: 8px 0; border: 1px solid #ccc; border-radius: 6px; background: #f7f9fb; }
  </style>
</head>
<body>

  <h2>Test Koneksi ke Firestore</h2>
  <p id="status">Menghubungkan ke Firestore...</p>

  <div id="soal-box">
    <p id="teks-soal"></p>
    <div class="pilihan" id="pilihan-a"></div>
    <div class="pilihan" id="pilihan-b"></div>
    <div class="pilihan" id="pilihan-c"></div>
    <div class="pilihan" id="pilihan-d"></div>
  </div>

  <!-- Firebase SDK Compat -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

  <script>
    // Konfigurasi Asli dari Firebase Console Anda
    const firebaseConfig = {
      apiKey: "AIzaSyAvngCmmhdh_0IKMv3UpMCU_lXq1EYK6ps",
      authDomain: "quizapplication-c0034.firebaseapp.com",
      projectId: "quizapplication-c0034",
      storageBucket: "quizapplication-c0034.firebasestorage.app",
      messagingSenderId: "524989891652",
      appId: "1:524989891652:web:2a33e25bc0c907cbee2811",
      measurementId: "G-22M0EVBGF"
    };

    // Inisialisasi Firebase & Firestore
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // Mengambil data dari koleksi 'soal'
    db.collection("soal").limit(1).get()
      .then((querySnapshot) => {
        if (!querySnapshot.empty) {
          document.getElementById("status").innerText = "Koneksi Berhasil!";
          document.getElementById("status").style.color = "green";
          document.getElementById("soal-box").style.display = "block";

          querySnapshot.forEach((doc) => {
            const data = doc.data();
            document.getElementById("teks-soal").innerText = data.teks_soal || "Soal kosong";
            document.getElementById("pilihan-a").innerText = "A. " + (data.pilihan_a || "");
            document.getElementById("pilihan-b").innerText = "B. " + (data.pilihan_b || "");
            document.getElementById("pilihan-c").innerText = "C. " + (data.pilihan_c || "");
            document.getElementById("pilihan-d").innerText = "D. " + (data.pilihan_d || "");
          });
        } else {
          document.getElementById("status").innerText = "Koneksi Berhasil, tapi belum ada data di koleksi 'soal'.";
        }
      })
      .catch((error) => {
        document.getElementById("status").innerText = "Gagal terhubung: " + error.message;
        document.getElementById("status").style.color = "red";
      });
  </script>
</body>
</html>
